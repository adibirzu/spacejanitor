[package]
name = "sj-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "High-speed Rust CLI & desktop IPC engine for SpaceJanitor."

[[bin]]
name = "sj"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
sj-core = { path = "../sj-core" }

[dev-dependencies]
tempfile = "3"

[package]
name = "sj-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SpaceJanitor high-speed Rust core: immutable protected-path denylist, secret redaction, and schema contracts."

[dependencies]
jwalk = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

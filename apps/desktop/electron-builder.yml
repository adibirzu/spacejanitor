appId: dev.spacejanitor.desktop
productName: SpaceJanitor
copyright: Copyright (c) 2026 Adrian Birzu (MIT License)
# MUST equal the apps/desktop "electron" devDependency; scripts/electron-pin.cjs (CI + desktop tests) enforces it.
electronVersion: "42.11.16"
asar: true
beforePack: scripts/before-pack.cjs

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - build/**/*
  - package.json
  - "!dist-test/**"
  - "!test/**"
  - "!src/**"
  - from: ../ui/dist
    to: ui/dist
  - from: ../../packages/core/src
    to: node_modules/@spacejanitor/core/src
  - from: ../../packages/core/package.json
    to: node_modules/@spacejanitor/core/package.json

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: SpaceJanitor-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

# Arch is NOT listed per target for linux/win: release.yml passes --x64/--arm64 per matrix job, and an
# arch list in this file would override that flag (every job would pack both arches with one sj).
linux:
  category: System
  # Without this electron-builder derives the name from the scoped npm package (@spacejanitor/desktop).
  executableName: spacejanitor
  # Required by the .deb target; a no-reply address so no personal email ships in the package.
  maintainer: SpaceJanitor contributors <noreply@users.noreply.github.com>
  icon: build/icon.png
  artifactName: SpaceJanitor-${version}-${arch}.${ext}
  target:
    - target: AppImage
    - target: deb

win:
  icon: build/icon.png
  target:
    - target: nsis
    - target: msi

nsis:
  artifactName: SpaceJanitor-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

msi:
  artifactName: SpaceJanitor-${version}-${arch}.${ext}

appId: dev.spacejanitor.desktop
productName: SpaceJanitor
copyright: Copyright (c) 2026 Adrian Birzu (MIT License)
electronVersion: "35.7.5"
asar: true

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist-test/**"
  - "!test/**"
  - "!src/**"
  - from: ../ui/dist
    to: ui/dist
  - from: ../../packages/core/src
    to: node_modules/@spacejanitor/core/src
  - from: ../../packages/core/package.json
    to: node_modules/@spacejanitor/core/package.json

extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: SpaceJanitor-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

linux:
  category: System
  icon: build/icon.png
  artifactName: SpaceJanitor-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: msi
      arch:
        - x64
        - arm64

nsis:
  artifactName: SpaceJanitor-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

msi:
  artifactName: SpaceJanitor-${version}-${arch}.${ext}

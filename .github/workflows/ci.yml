name: SpaceJanitor CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  oss-hygiene-and-secrets:
    name: OSS Hygiene & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SpaceJanitor OSS hygiene gate
        run: node scripts/check-oss-hygiene.mjs
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-core-tests:
    name: Rust Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test
        run: cargo test --workspace
      - name: Verify Rust doctor
        run: cargo run -p sj-cli -- doctor --json

  cross-platform-node-tests:
    name: Node CLI & SDK (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust sj gate (the Node gate wrappers delegate every safety decision to it)
        run: cargo build -p sj-cli
      - name: Run unit tests (with sj)
        run: npm test
      - name: Run unit tests with the gate disabled (every protection check must fail closed)
        run: npm test
        env:
          SPACEJANITOR_NO_SJ: "1"
      - name: Verify CLI doctor
        run: node packages/cli/bin/spacejanitor.mjs doctor --json

  desktop-tests:
    name: Desktop typecheck & tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Rust sj gate (desktop integration tests drive the real binary)
        run: cargo build -p sj-cli
      - name: Typecheck desktop and UI
        run: npm run desktop:typecheck
      - name: Run desktop tests
        run: npm run desktop:test
      - name: Run desktop tests with the gate disabled (destructive actions must be refused)
        run: npm run desktop:test
        env:
          SPACEJANITOR_NO_SJ: "1"

  # Electron desktop release matrix (enabled once M5 desktop bundle lands):
  #   - macOS Universal (arm64 + x86_64) on macos-15
  #   - Linux x86_64 (.AppImage / .deb) on ubuntu-latest
  #   - Linux ARM64 (.AppImage / .deb) on ubuntu-24.04-arm
  #   - Windows x86_64 (.exe / .msi) on windows-latest
  #   - Windows ARM64 (.exe / .msi) on windows-11-arm

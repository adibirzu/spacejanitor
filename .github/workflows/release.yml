name: SpaceJanitor Multi-OS Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build all CLI & Desktop artifacts without publishing a GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  hygiene-and-secrets:
    name: OSS Hygiene & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SpaceJanitor OSS hygiene gate
        run: node scripts/check-oss-hygiene.mjs
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-cli-matrix:
    name: Build sj CLI (${{ matrix.artifact }})
    needs: hygiene-and-secrets
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: sj-darwin-arm64
            ext: tar.gz
          - os: macos-15
            target: x86_64-apple-darwin
            artifact: sj-darwin-x64
            ext: tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: sj-linux-x64
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: sj-linux-arm64
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sj-win32-x64
            ext: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: sj-win32-arm64
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build sj-cli release binary
        run: cargo build --release -p sj-cli --target ${{ matrix.target }}
      - name: Package CLI archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist-cli
          cp target/${{ matrix.target }}/release/sj dist-cli/sj
          tar -czf dist-cli/${{ matrix.artifact }}.${{ matrix.ext }} -C dist-cli sj
      - name: Package CLI archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-cli | Out-Null
          Copy-Item target/${{ matrix.target }}/release/sj.exe dist-cli/sj.exe
          Compress-Archive -Path dist-cli/sj.exe -DestinationPath dist-cli/${{ matrix.artifact }}.${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.artifact }}
          path: dist-cli/${{ matrix.artifact }}.${{ matrix.ext }}

  desktop-installer-matrix:
    name: Build Desktop Installers (${{ matrix.label }})
    needs: rust-cli-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-universal
            os: macos-15
            cli_artifact: cli-sj-darwin-arm64
            eb_flags: "--mac --universal"
          - label: linux-x64
            os: ubuntu-24.04
            cli_artifact: cli-sj-linux-x64
            eb_flags: "--linux --x64"
          - label: linux-arm64
            os: ubuntu-24.04-arm
            cli_artifact: cli-sj-linux-arm64
            eb_flags: "--linux --arm64"
          - label: windows-x64-arm64
            os: windows-latest
            cli_artifact: cli-sj-win32-x64
            eb_flags: "--win --x64 --arm64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download matching Rust sj binary
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.cli_artifact }}
          path: .tmp-cli
      - name: Stage sj binary into apps/desktop/resources/bin (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p apps/desktop/resources/bin
          tar -xzf .tmp-cli/*.tar.gz -C apps/desktop/resources/bin
          chmod +x apps/desktop/resources/bin/sj
      - name: Stage sj binary into apps/desktop/resources/bin (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/resources/bin | Out-Null
          Expand-Archive -Path .tmp-cli/*.zip -DestinationPath apps/desktop/resources/bin -Force
      - name: Build UI & Electron main/preload
        run: npm run desktop:build
      - name: Package installers with electron-builder
        # Optional code signing & notarization (unsigned community builds work when secrets are unset):
        #   CSC_LINK: ${{ secrets.CSC_LINK }}
        #   CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        #   APPLE_ID: ${{ secrets.APPLE_ID }}
        #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx --workspace @spacejanitor/desktop electron-builder --config apps/desktop/electron-builder.yml --publish never ${{ matrix.eb_flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi

  publish-release:
    name: Checksums & GitHub Release
    needs: [rust-cli-matrix, desktop-installer-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate unified SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-assets/SHA256SUMS.txt
      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
